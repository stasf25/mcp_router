services:
  mcp_router:
    build: .
    env_file:
      - .env
    environment:
      - MCP_ROUTER_JWT_SECRET=${MCP_ROUTER_JWT_SECRET:-}
    ports:
      # наружу — только на HOST_DOMAIN (по умолчанию 127.0.0.1, если в .env нет)
      - "${HOST_DOMAIN:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - mcp_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  playwright:
    image: mcp/playwright:latest
    container_name: playwright
    ports:
      - "8931:8931"
    entrypoint: node
    command: >
      /app/cli.js
      --headless
      --browser chromium
      --no-sandbox
      --port 8931
      --host 0.0.0.0
      --allowed-hosts *
    shm_size: '1gb'
    networks:
      - mcp_net
    restart: unless-stopped

networks:
  mcp_net:
    driver: bridge
