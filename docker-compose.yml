services:
  mcp_router:
    build: .
    container_name: mcp_router
    env_file:
      - .env
    environment:
      - MCP_ROUTER_JWT_SECRET=${MCP_ROUTER_JWT_SECRET:-}
    ports:
      # наружу — только на HOST_DOMAIN (по умолчанию 127.0.0.1, если в .env нет)
      - "${HOST_DOMAIN:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - mcp_net
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  playwright:
    image: mcp/playwright:latest
    container_name: playwright
    init: true # <--- Магия Docker для добавления tini
    ports:
      - "8931:8931"
    command: >
      --port 8931
      --host 0.0.0.0
      --allowed-hosts "*"
      --shared-browser-context
    shm_size: '1gb'
    networks:
      - mcp_net
    restart: unless-stopped

networks:
  mcp_net:
    driver: bridge
  shared-network:
    external: ${SHARED_NETWORK:-false}