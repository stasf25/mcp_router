servers:
  - name: playwright
    url: http://playwright:8931/mcp
    enabled: true
    timeout: 30

  - name: brightdata
    url: https://mcp.brightdata.com/mcp
    headers:
      - Authorization: Bearer ${BRIGHTDATA_TOKEN}
    enabled: true
    timeout: 30

groups:
  - name: web_scraping
    tools:
      - playwright.browser_navigate
      - playwright.browser_click
      - brightdata.scrape_as_html
    enabled: true

  - name: web_search
    tools:
      - brightdata.search_engine
    enabled: true
